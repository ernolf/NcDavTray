name: release

# The release is written by hand -- notes, title, whether it is a pre-release --
# and this only hangs the archive on it. So it waits for the release to exist
# rather than creating one from a tag.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  archive:
    name: Attach the release archive
    runs-on: windows-latest
    permissions:
      contents: write # gh release upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # What the release points at, not the default branch: a release is cut
          # from a tag and that tag is what has to be built.
          ref: ${{ github.event.release.tag_name }}

      # The updater compares the version in the script against the tag of the
      # newest release. Those two disagreeing is not a cosmetic problem: every
      # installation would be told forever that an update is waiting, or none
      # would ever hear of one. So it is settled here, before anything is built.
      - name: Tag and meta/Version.ps1 agree
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          . .\meta\AppName.ps1
          . .\meta\Version.ps1
          if ($env:TAG -ne "v$Version") { throw "release $env:TAG was cut from a tree that says $Version -- see meta/Version.ps1" }
          "archive=${AppName}_v$Version.zip" >> $env:GITHUB_ENV

      # The same targets a contributor runs at home, in the same order.
      - name: make check
        shell: cmd
        run: make.cmd check

      - name: make dist
        shell: cmd
        run: make.cmd dist

      - name: Attach it
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload $env:TAG "build\$($env:archive)" --clobber

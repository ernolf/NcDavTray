#
# ncmake workflow updater: on a schedule, refreshes the ncmake-managed CI
# workflows from their upstream templates (make workflows-update) and opens a
# pull request when anything changed. This replaces Dependabot for the files
# under .github/workflows/. Once that pull request is merged it deletes its own
# branch, so no stale ncmake/ci/workflow-update branch is left behind.
#
# Besides the default branch it refreshes every stable* maintenance line whose
# workflows ncmake manages, each through a pull request of its own against the
# line from ncmake/ci/workflow-update-<branch>, the branch make workflows-update
# PR=1 uses there. A line keeps the set of workflows of the tag it started from:
# only those are refreshed, and a workflow the default branch gained later comes
# over with make workflows-install.
#
# A comment of "@ncmake-updater rebase" on a pull request re-runs the update
# job, which is all a rebase needs here: the job checks out the base branch,
# regenerates the workflows and lets create-pull-request rebuild the branch from
# that base. Going through the API is what keeps the commit verified -- a git
# rebase in the runner would push unsigned commits, because no key lives there.
#
# Authentication is a GitHub App (Contents, Pull requests and Workflows: write),
# minted per run as a short-lived token. The app is required because the default
# GITHUB_TOKEN may not push workflow files, and it is preferred over a PAT
# because the same token both pushes the files and produces verified, signed
# commits. Store its credentials as the NCMAKE_UPDATER_CLIENT_ID and
# NCMAKE_UPDATER_PRIVATE_KEY secrets. See
# https://github.com/ernolf/ncmake/wiki/Workflow-updater and
# https://github.com/ernolf/ncmake/wiki/GitHub-App.

name: ncmake workflow update

on:
  schedule:
    # Daily at 05:30 UTC. GitHub starts scheduled runs on a best-effort basis and
    # delays them under load, so expect this a few hours late, not on the minute
    # (see https://github.com/ernolf/ncmake/wiki/Workflow-updater). Trigger
    # workflow_dispatch to run without
    # waiting for the schedule.
    - cron: '30 5 * * *'
  workflow_dispatch:
  # React to a merge so the cleanup job can remove the updater's own branch.
  # This fires for every closed pull request in the repository; the cleanup job
  # filters down to a merged ncmake/ci/workflow-update branch.
  pull_request:
    types: [closed]
  # "@ncmake-updater rebase" in a pull request comment. issue_comment fires for
  # every comment in the repository, plain issues included; the branches job
  # filters down to pull request comments that carry the command.
  issue_comment: # zizmor: ignore[dangerous-triggers] commands only from OWNER/MEMBER/COLLABORATOR, no comment text in run:, a branch of this repository checked out, never the pull request head
    types: [created]

permissions:
  contents: read

concurrency:
  group: ncmake-workflow-update
  cancel-in-progress: false

jobs:
  branches:
    # The scheduled/manual side: pick the branches to refresh. Skipped for the
    # pull_request trigger, which only drives the cleanup job.
    #
    # Who may ask is what matters for the command, and that is the author
    # association -- without it any passer-by could force-push an updater branch.
    if: >-
      github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
      || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && contains(github.event.comment.body, '@ncmake-updater rebase')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
          github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    # Reacting to the comment and reading the branches and the pull request are
    # all the default token is used for here.
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Acknowledge the command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=eyes

      - name: Pick the branches
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.issue.number }}
        run: |
          default=$(gh api "repos/$REPO" --jq .default_branch)
          bases=$default
          if [ "$EVENT" = issue_comment ]; then
            # The command rebuilds the pull request it is written on when that
            # is the one of a line; on any other pull request it means the one
            # of the default branch, as before the lines were covered.
            head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.ref)
            base=$(gh api "repos/$REPO/pulls/$PR" --jq .base.ref)
            case $base in
              stable*) [ "$head" != "ncmake/ci/workflow-update-$base" ] || bases=$base ;;
            esac
          else
            # Only the lines ncmake manages workflows on: a branch without the
            # lock file has no managed workflow to refresh, and a retired line
            # whose branch is deleted is no longer listed.
            for b in $(gh api --paginate "repos/$REPO/branches" --jq '.[].name | select(startswith("stable"))'); do
              if gh api "repos/$REPO/contents/.github/workflows/.ncmake-workflows.json?ref=$b" --silent 2>/dev/null; then
                bases=$(printf '%s\n%s' "$bases" "$b")
              fi
            done
          fi
          matrix=$(printf '%s\n' "$bases" | jq -Rsc --arg d "$default" \
            'split("\n") | map(select(length > 0)) | map({base: ., branch: (if . == $d then "ncmake/ci/workflow-update" else "ncmake/ci/workflow-update-" + . end)})')
          printf 'Branches to refresh:\n%s\n' "$bases"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  update:
    # Refresh the workflows of one branch and open the pull request against it.
    needs: branches
    runs-on: ubuntu-latest
    strategy:
      # A line that fails, for example one whose checkout predates ncmake, must
      # not hold back the others.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.branches.outputs.matrix) }}
    # Reacting to the comment is the only thing the default token is used for
    # here; everything that touches the repository runs on the app token.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.NCMAKE_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.NCMAKE_UPDATER_PRIVATE_KEY }}
          # Without these the token carries every permission of the app.
          permission-contents: write # push the update branch
          permission-pull-requests: write # open the pull request
          permission-workflows: write # the branch changes .github/workflows/
          permission-metadata: read

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.base }}
          persist-credentials: false

      - name: Refresh managed workflows from upstream
        id: refresh
        env:
          # 'make dev-init' lists the ncmake modules through the GitHub API, and
          # an anonymous call gets 60 requests per hour counted per source IP --
          # shared by every job on a hosted runner, so it answers 403 every so
          # often and fails the step. The app token is already minted above.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          make dev-init
          make workflows-update
          # LICENSES/ holds the texts make workflows-update adds for a license an
          # updated workflow names. create-pull-request stages add-paths with one
          # git add, which stages nothing when a path does not exist, so
          # LICENSES/ is named only where it does.
          echo "paths=.github/workflows/$(test ! -d LICENSES || echo ,LICENSES/)" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          signoff: true
          base: ${{ matrix.base }}
          branch: ${{ matrix.branch }}
          delete-branch: true
          add-paths: ${{ steps.refresh.outputs.paths }}
          title: 'ci: update managed CI workflows from upstream'
          commit-message: 'ci: update managed CI workflows from upstream'
          body: |
            Automated by the ncmake workflow updater.

            `make workflows-update` refreshed the ncmake-managed workflows from
            their sources (the app's .ncmake/workflows/, ernolf/ncmake-workflows,
            nextcloud/.github). Locally modified workflows are left untouched.
            Review the diff and merge.

            ---

            Commands, written as a comment on this pull request:

            - `@ncmake-updater rebase` rebuilds this branch on top of the
              current base

      - name: Report the command as done
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
            -f content=rocket

  cleanup:
    # Delete the updater's own branch as soon as its pull request is merged,
    # instead of leaving it until the next scheduled run removes it (which is
    # what create-pull-request's delete-branch does). It uses the same GitHub
    # App as the update job, so it always has Contents: write regardless of the
    # repository's default token permissions. This only ever touches
    # ncmake/ci/workflow-update and the ncmake/ci/workflow-update-<branch> of a
    # line, pushed to this repository, never a fork's branch of the same name,
    # and is unrelated to the repository-wide
    # "Automatically delete head branches" setting
    # (see https://github.com/ernolf/ncmake/wiki/Deleting-merged-branches).
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && (
        github.event.pull_request.head.ref == 'ncmake/ci/workflow-update'
        || startsWith(github.event.pull_request.head.ref, 'ncmake/ci/workflow-update-stable')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.NCMAKE_UPDATER_CLIENT_ID }}
          private-key: ${{ secrets.NCMAKE_UPDATER_PRIVATE_KEY }}
          permission-contents: write # delete the branch
          permission-metadata: read

      - name: Delete the merged updater branch if it is still there
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          ref="repos/${{ github.repository }}/git/refs/heads/$HEAD_REF"
          # The repository's "Automatically delete head branches" setting, or a
          # fast-clicking admin, may have removed the branch already. Only delete
          # what is still there, and tolerate it vanishing between the check and
          # the delete, so a redundant run is a quiet no-op, not a failure.
          if gh api "$ref" >/dev/null 2>&1; then
            gh api --method DELETE "$ref" \
              || echo "Branch was removed concurrently; nothing to do."
          else
            echo "Branch already deleted; nothing to do."
          fi
